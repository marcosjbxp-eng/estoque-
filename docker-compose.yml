version: '3.8'

services:
  db:
    image: mysql:8.0
    container_name: estoque_mysql
    restart: always
    environment:
      MYSQL_DATABASE: ${MYSQL_DATABASE:-estoque_db}
      MYSQL_USER: ${MYSQL_USER:-estoque_user}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD:-estoque_pass}
      MYSQL_ROOT_PASSWORD: ${MYSQL_PASSWORD:-estoque_pass}
    ports:
      - "3306:3306"
    volumes:
      - mysql_data:/var/lib/mysql

  web:
    build: .
    container_name: estoque_web
    command: >
      bash -c "python manage.py migrate &&
               python manage.py setup_initial_data &&
               python manage.py runserver 0.0.0.0:8000"
    volumes:
      - .:/app
    ports:
      - "8000:8000"
    env_file:
      - .env
    depends_on:
      - db

volumes:
  mysql_data:
